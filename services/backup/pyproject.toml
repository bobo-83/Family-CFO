[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "family-cfo-backup"
version = "0.1.0"
description = "Encrypted database/document backup adapters for Family CFO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # cryptography >=50 clears CVE-2026-69247 (and the earlier PYSEC-2026-35,
  # CVE-2026-26007, GHSA-537c-gmf6-5ccf). This is the binding constraint for
  # the API image (which pulls cryptography via this package).
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
