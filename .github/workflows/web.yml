name: Web Dashboard

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'shared/openapi/**'
      - '.github/workflows/web.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'shared/openapi/**'
      - '.github/workflows/web.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated client is up to date with the OpenAPI contract
        run: |
          npm run generate:client
          git diff --exit-code -- src/app/api-client \
            || (echo "Generated API client is stale — run 'npm run generate:client' and commit." && exit 1)

      - name: Build
        # #10: the point of compile-time i18n is that a missing or malformed
        # translation is a BUILD failure, not a runtime surprise. Angular only
        # warns, so fail the job when any locale lacks a translation — this is
        # the ratchet that keeps every converted string translated in all three
        # locales as more pages are extracted.
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -q "No translation found" build.log; then
            echo "::error::Untranslated messages — add them to src/locale/messages.<locale>.xlf:"
            grep "No translation found" build.log | sed 's/^/  /' | head -40
            exit 1
          fi

      - name: Unit tests
        run: npm test
        env:
          CI: "true"
