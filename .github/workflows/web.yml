name: Web Dashboard

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'shared/openapi/**'
      - '.github/workflows/web.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'shared/openapi/**'
      - '.github/workflows/web.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated client is up to date with the OpenAPI contract
        run: |
          npm run generate:client
          git diff --exit-code -- src/app/api-client \
            || (echo "Generated API client is stale — run 'npm run generate:client' and commit." && exit 1)

      - name: Build and check translations
        # #10: a missing or malformed translation must be a BUILD failure, not a
        # runtime surprise. #33: the check lives in a script so CI and a local
        # run assert the SAME thing — an inline `build | grep -c` passes when the
        # build dies before printing, which is how a corrupt catalog once got
        # reported as verified.
        working-directory: ${{ github.workspace }}
        run: scripts/check-web-i18n.sh

      - name: Unit tests
        run: npm test
        env:
          CI: "true"
