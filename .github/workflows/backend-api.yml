name: Backend API

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'services/**'
      - 'database/**'
      - 'shared/openapi/**'
      - 'shared/schemas/**'
      - 'AGENTS.md'
      - '.env.example'
      - 'docker-compose.yml'
      - 'docs/guides/backup-and-restore.md'
      - 'docs/specs/12-implementation-tasks.md'
      - '.github/workflows/backend-api.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'services/**'
      - 'database/**'
      - 'shared/openapi/**'
      - 'shared/schemas/**'
      - 'AGENTS.md'
      - '.env.example'
      - 'docker-compose.yml'
      - 'docs/guides/backup-and-restore.md'
      - 'docs/specs/12-implementation-tasks.md'
      - '.github/workflows/backend-api.yml'

jobs:
  lint-test-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: family_cfo
          POSTGRES_PASSWORD: family_cfo_test
          POSTGRES_DB: family_cfo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_cfo -d family_cfo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FAMILY_CFO_REQUIRE_POSTGRESQL: "1"
      FAMILY_CFO_TEST_DATABASE_URL: postgresql+psycopg://family_cfo:family_cfo_test@localhost:5432/family_cfo_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            services/financial-engine/pyproject.toml
            services/ai-orchestrator/pyproject.toml

      # The production image ships tesseract, so the suite must pass WITH it
      # present — asserting a tool's absence is how the OCR stub test once
      # passed CI while failing in the shipped container (AGENTS.md: Tests
      # Run Everywhere).
      - name: Install tesseract (match the production image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install API test dependencies
        run: make install

      - name: Lint API
        run: make lint

      # Runs the whole suite AND enforces 100% coverage of the modules listed in
      # the Makefile's COVERED_MODULES — one run, not two.
      - name: Test API (with crypto coverage gate)
        run: make coverage

      - name: Check OpenAPI contract drift
        run: make check-openapi
