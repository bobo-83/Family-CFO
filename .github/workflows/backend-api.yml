name: Backend API

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'services/**'
      - 'database/**'
      - 'shared/openapi/**'
      - 'shared/schemas/**'
      - '.github/workflows/backend-api.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'services/**'
      - 'database/**'
      - 'shared/openapi/**'
      - 'shared/schemas/**'
      - '.github/workflows/backend-api.yml'

jobs:
  lint-test-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            services/financial-engine/pyproject.toml
            services/ai-orchestrator/pyproject.toml

      - name: Install API test dependencies
        run: make install

      - name: Lint API
        run: make lint

      # Runs the whole suite AND enforces 100% coverage of the modules listed in
      # the Makefile's COVERED_MODULES — one run, not two.
      - name: Test API (with crypto coverage gate)
        run: make coverage

      - name: Check OpenAPI contract drift
        run: make check-openapi
