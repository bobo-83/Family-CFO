name: Service Packages

on:
  pull_request:
    paths:
      - 'services/**'
      - 'shared/**'
      - 'scripts/swap-model.sh'
      - 'scripts/lib/swap_lock.py'
      - 'scripts/tests/test_swap_model.py'
      - '.github/workflows/services.yml'
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'shared/**'
      - 'scripts/swap-model.sh'
      - 'scripts/lib/swap_lock.py'
      - 'scripts/tests/test_swap_model.py'
      - '.github/workflows/services.yml'

jobs:
  swap-integration:
    name: Swap integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install manager and test dependencies
        run: pip install -e 'services/model-manager[dev]'
      - name: Install and start Docker (Linux bind-mount gate)
        if: runner.os == 'Linux'
        uses: docker/setup-docker-action@v4
      - name: Prepare synthetic lock-test runtime (no models)
        if: runner.os == 'Linux'
        run: docker pull python:3.12-slim
      - name: Portable real-script integration
        run: python -m pytest -q scripts/tests/test_swap_model.py -k 'not docker_bind_mount'
      - name: Required host/container contention
        if: runner.os == 'Linux'
        run: python -m pytest -q scripts/tests/test_swap_model.py -k docker_bind_mount
        env:
          FAMILY_CFO_REQUIRE_DOCKER: '1'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - financial-engine
          - ai-orchestrator
          - ocr-worker
          - scheduler
          - backup
          - model-manager
    defaults:
      run:
        working-directory: services/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.package }}/pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Install tesseract (ocr-worker's real-OCR test)
        if: matrix.package == 'ocr-worker'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest
        env:
          # ocr-worker: the real-tesseract test must FAIL here, not skip, if
          # the binary ever vanishes from the runner (AGENTS.md: Tests Run
          # Everywhere).
          FAMILY_CFO_REQUIRE_TESSERACT: ${{ matrix.package == 'ocr-worker' && '1' || '' }}
