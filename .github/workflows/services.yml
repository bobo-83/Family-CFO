name: Service Packages

on:
  pull_request:
    paths:
      - 'services/**'
      - 'shared/**'
      - '.github/workflows/services.yml'
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'shared/**'
      - '.github/workflows/services.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - financial-engine
          - ai-orchestrator
          - ocr-worker
          - scheduler
          - backup
          - model-manager
    defaults:
      run:
        working-directory: services/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.package }}/pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Install tesseract (ocr-worker's real-OCR test)
        if: matrix.package == 'ocr-worker'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest
        env:
          # ocr-worker: the real-tesseract test must FAIL here, not skip, if
          # the binary ever vanishes from the runner (AGENTS.md: Tests Run
          # Everywhere).
          FAMILY_CFO_REQUIRE_TESSERACT: ${{ matrix.package == 'ocr-worker' && '1' || '' }}
