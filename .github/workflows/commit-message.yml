name: Commit Message

# Pull-request only. The convention is enforced on the commits BEFORE they land;
# once merged, main's tip is GitHub's own merge- or squash-commit whose message
# it generates (no required sections, non-conventional subject) — re-validating
# that on push is both redundant and unfixable, and only ever fails.
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail

          # Validate against the LIVE base branch, not the event's base.sha
          # snapshot: after a rebase onto a newer base, the snapshot range
          # sweeps in the base's own squash commits — whose GitHub-suffixed
          # titles ("… (#160)") can exceed 72 chars and are not ours to fix.
          # Two-dot against origin/<base> excludes everything already merged.
          git fetch --quiet origin "${{ github.base_ref }}"
          range="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

          # Skip merge commits an intermediate merge may have pulled into the PR;
          # GitHub generates their message, not authored to the convention.
          git rev-list --reverse --no-merges "$range" | while read -r commit_sha; do
            # Bot commits (dependabot & co.) write their own messages and can't
            # follow the human template; the convention governs authored work.
            author_email=$(git log --format=%ae -n 1 "$commit_sha")
            case "$author_email" in
              *dependabot*|*"[bot]"*) echo "Skipping bot commit $commit_sha"; continue ;;
            esac
            echo "Validating $commit_sha"
            git log --format=%B -n 1 "$commit_sha" > /tmp/commit-message.txt
            scripts/validate-commit-message.sh /tmp/commit-message.txt
          done
