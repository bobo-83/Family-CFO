# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# The DEFAULT HTTPS server: the self-signed certificate, and the only one when
# no tailnet certificate has been installed.
#
# `default_server` is what a connection lands on when SNI names nothing we
# recognise — and, crucially, when there is NO SNI at all, which is every
# connection made by IP address. `server_name _` matches nothing on its own (`_`
# is not a wildcard in nginx, just a name no host can equal), so this block is
# reached *purely* by being the default. It already was the default implicitly,
# being the only 443 block; saying it makes the choice independent of how many
# other blocks exist and of the order conf.d files happen to load in.
#
# The optional companion is /etc/nginx/conf.d/tailnet.conf, written at container
# start by web-render-tailnet-conf.sh when TLS_TAILNET_NAME is set AND a
# CA-signed certificate for that name is in the certs volume. It matches by SNI
# only, so it can never take traffic away from this block: an IP connection
# sends no name to match. See docs/guides/second-household-access.md for why the
# second certificate exists (iOS refuses self-signed certificates on public
# FQDNs and CGNAT addresses, whatever the app's URLSession delegate says).
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # ~120 lines of headers, locations and proxies, shared verbatim with the
    # tailnet block so the two addresses cannot drift apart.
    include /etc/nginx/family-cfo/server-common.conf;
}
